services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dataplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/dataplatform
      REDIS_URL: redis://redis:6379/0
      PROCESS_ASYNC: "true"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.api.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/dataplatform
      REDIS_URL: redis://redis:6379/0
      PROCESS_ASYNC: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A src.workers.celery_app.celery_app worker --loglevel=INFO

volumes:
  postgres_data:
